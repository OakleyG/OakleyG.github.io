name: Build portfolio manifest

# Regenerate portfolio/manifest.json whenever images are added/removed.
on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'build_portfolio.py'
      - '.github/workflows/build-portfolio.yml'

# Allow the action to commit the regenerated manifest back to the repo.
permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate thumbnails and manifest
        run: python build_portfolio.py

      - name: Commit thumbnails + manifest if they changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio/manifest.json portfolio/thumbs
          if git diff --cached --quiet; then
            echo "Nothing changed — nothing to commit."
          else
            git commit -m "chore: regenerate portfolio thumbnails + manifest [skip ci]"
            git push
          fi
